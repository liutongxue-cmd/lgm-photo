# 修复后的 GitHub Actions 部署配置
# 注意：确保此文件位于仓库根目录的 .github/workflows/ 下
# 确保 package.json 也在仓库根目录下（不在子文件夹里）

name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 安装依赖
      - run: npm ci

      # 构建（tsc + vite build）
      - run: npm run build

      # 上传构建产物到 GitHub Pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
